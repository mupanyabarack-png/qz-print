<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Facture</title>

  <style>
    body{
      font-family: Arial;
      font-size: 14px;
      width: 300px;
      margin: auto;
    }

    h2, h3{
      text-align:center;
      margin: 5px;
    }

    .info{
      margin-bottom:10px;
    }

    table{
      width:100%;
      border-collapse: collapse;
      margin-top:10px;
    }

    th, td{
      border:1px solid black;
      padding:5px;
      text-align:center;
    }

    .total{
      margin-top:10px;
      font-weight:bold;
    }

    button{
      width:100%;
      padding:10px;
      margin-top:10px;
    }
  </style>
</head>

<body>

  <h2 id="entreprise"></h2>
  <h3 id="agence"></h3>

  <div class="info">
    <p><b>FACTURE :</b> <span id="facture"></span></p>
    <p><b>DATE :</b> <span id="date"></span></p>
    <p><b>CLIENT :</b> <span id="client"></span></p>
  </div>

  <table>
    <thead>
      <tr>
        <th>Produit</th>
        <th>Qté</th>
        <th>PU</th>
        <th>Total</th>
      </tr>
    </thead>

    <tbody id="produits"></tbody>
  </table>

  <div class="total">
    <p>TOTAL : <span id="total"></span></p>
    <p>PAYÉ : <span id="paye"></span></p>
    <p>RESTE : <span id="reste"></span></p>
    <p>STATUT : <span id="statut"></span></p>
  </div>

  <p style="text-align:center;">Merci pour votre confiance</p>

  <button onclick="window.print()">Imprimer</button>

<script>

const params = new URLSearchParams(window.location.search);

// Infos générales
document.getElementById("entreprise").innerText = params.get("entreprise") || "";
document.getElementById("agence").innerText = params.get("agence") || "";
document.getElementById("facture").innerText = params.get("facture") || "";
document.getElementById("date").innerText = params.get("date") || "";
document.getElementById("client").innerText = params.get("client") || "";

document.getElementById("total").innerText = params.get("montant_total") || "0";
document.getElementById("paye").innerText = params.get("montant_paye") || "0";
document.getElementById("reste").innerText = params.get("reste") || "0";
document.getElementById("statut").innerText = params.get("statut") || "";

// PRODUITS
const produits = params.get("produits") || "";
const tbody = document.getElementById("produits");

if(produits !== ""){

  const lignes = produits.split(";");

  lignes.forEach(ligne => {

    const data = ligne.split(",");

    if(data.length >= 4){

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${data[0]}</td>
        <td>${data[1]}</td>
        <td>${data[2]}</td>
        <td>${data[3]}</td>
      `;

      tbody.appendChild(tr);

    }

  });

}

</script>

</body>
</html>
