<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Facture</title>

<style>

body{
  font-family:Arial;
  width:320px;
  margin:auto;
  font-size:14px;
}

h2,h3{
  text-align:center;
  margin:5px;
}

.produit{
  border-bottom:1px dashed black;
  padding:5px 0;
}

.footer{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
}

/* Cache le bouton pendant impression */
@media print {
  button{
    display:none;
  }
}

</style>
</head>

<body>

<h2 id="entreprise"></h2>
<h3 id="agence"></h3>

<p><b>FACTURE :</b> <span id="facture"></span></p>
<p><b>DATE :</b> <span id="date"></span></p>
<p><b>CLIENT :</b> <span id="client"></span></p>

<div id="produits"></div>

<p><b>TOTAL :</b> <span id="total"></span></p>
<p><b>PAYÉ :</b> <span id="paye"></span></p>
<p><b>RESTE :</b> <span id="reste"></span></p>
<p><b>STATUT :</b> <span id="statut"></span></p>

<div class="footer">
<p id="footerEntreprise"></p>
</div>

<button onclick="window.print()">Imprimer</button>

<script>

const params = new URLSearchParams(window.location.search);

const entreprise = params.get("entreprise") || "";

document.getElementById("entreprise").innerText = entreprise;
document.getElementById("agence").innerText = params.get("agence") || "";
document.getElementById("facture").innerText = params.get("facture") || "";
document.getElementById("date").innerText = params.get("date") || "";
document.getElementById("client").innerText = params.get("client") || "";

document.getElementById("total").innerText = params.get("montant_total") || "0";
document.getElementById("paye").innerText = params.get("montant_paye") || "0";
document.getElementById("reste").innerText = params.get("reste") || "0";
document.getElementById("statut").innerText = params.get("statut") || "";

document.getElementById("footerEntreprise").innerText =
"Merci pour votre confiance - " + entreprise;

// =======================
// PRODUITS
// =======================

let produits = params.get("produits") || "";

produits = decodeURIComponent(produits);

const container = document.getElementById("produits");

if(produits.trim() !== ""){

  const lignes = produits.split("###");

  lignes.forEach(ligne => {

    const data = ligne.split("|||");

    if(data.length >= 4){

      const div = document.createElement("div");

      div.className = "produit";

      div.innerHTML = `
        <b>${data[0]}</b><br>
        Qté: ${data[1]}<br>
        PU: ${data[2]}<br>
        Total: ${data[3]}
      `;

      container.appendChild(div);
    }

  });

}

</script>

</body>
</html>
