<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Facture</title>

<style>

/* =======================
FORMAT TICKET 58mm
======================= */

body{
  font-family: Arial;
  width: 58mm;
  margin: auto;
  font-size: 12px;
}

h2,h3{
  text-align:center;
  margin:3px;
}

.produit{
  border-bottom:1px dashed black;
  padding:4px 0;
}

.footer{
  text-align:center;
  margin-top:10px;
  font-weight:bold;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
}

/* cacher bouton impression */
@media print {
  #printBtn{
    display:none !important;
  }
}

/* éviter coupure QR */
@media print {
  img{
    page-break-inside: avoid;
  }
}

</style>
</head>

<body>

<h2 id="entreprise"></h2>
<h3 id="agence"></h3>

<p><b>FACTURE :</b> <span id="facture"></span></p>
<p><b>DATE :</b> <span id="date"></span></p>
<p><b>CLIENT :</b> <span id="client"></span></p>

<hr>

<!-- PRODUITS -->
<div id="produits"></div>

<hr>

<p><b>TOTAL :</b> <span id="total"></span></p>
<p><b>PAYÉ :</b> <span id="paye"></span></p>
<p><b>RESTE :</b> <span id="reste"></span></p>
<p><b>STATUT :</b> <span id="statut"></span></p>

<!-- QR CODE -->
<div style="text-align:center; margin-top:10px;">
  <img id="qrImage" width="120" alt="QR Code">
</div>

<div class="footer">
<p id="footerEntreprise"></p>
</div>

<button id="printBtn" onclick="window.print()">
Imprimer
</button>

<script>

// =======================
// URL PARAMS
// =======================
const params = new URLSearchParams(window.location.search);

// =======================
// INFOS FACTURE
// =======================
const entreprise = params.get("entreprise") || "";
const agence = params.get("agence") || "";
const facture = params.get("facture") || "";
const date = params.get("date") || "";
const client = params.get("client") || "";
const total = params.get("montant_total") || "0";
const paye = params.get("montant_paye") || "0";
const reste = params.get("reste") || "0";
const statut = params.get("statut") || "";

// affichage infos
document.getElementById("entreprise").innerText = entreprise;
document.getElementById("agence").innerText = agence;
document.getElementById("facture").innerText = facture;
document.getElementById("date").innerText = date;
document.getElementById("client").innerText = client;

document.getElementById("total").innerText = total;
document.getElementById("paye").innerText = paye;
document.getElementById("reste").innerText = reste;
document.getElementById("statut").innerText = statut;

document.getElementById("footerEntreprise").innerText =
"Merci pour votre confiance - " + entreprise;

// =======================
// PRODUITS
// =======================
let produits = params.get("produits") || "";
produits = decodeURIComponent(produits);

let produitsQR = "";
const container = document.getElementById("produits");

if(produits.trim() !== ""){

  const lignes = produits.split("###");

  lignes.forEach(ligne => {

    const data = ligne.split("|||");

    if(data.length >= 4){

      const nom = data[0];
      const qte = data[1];
      const pu = data[2];
      const totalL = data[3];

      // affichage ticket
      const div = document.createElement("div");
      div.className = "produit";

      div.innerHTML =
        "<b>" + nom + "</b><br>" +
        "Qté: " + qte + "<br>" +
        "PU: " + pu + "<br>" +
        "Total: " + totalL;

      container.appendChild(div);

      // QR data
      produitsQR +=
        nom + " | Qté:" + qte +
        " | PU:" + pu +
        " | Total:" + totalL + "\n";
    }

  });

}

// =======================
// QR CODE FIABLE
// =======================

let qrText =
"FACTURE: " + facture + "\n" +
"CLIENT: " + client + "\n\n" +
produitsQR +
"\nTOTAL: " + total + "\n" +
"STATUT: " + statut;

const qrImg = document.getElementById("qrImage");

setTimeout(() => {
  qrImg.src =
  "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data="
  + encodeURIComponent(qrText);
}, 300);

</script>

</body>
</html>
