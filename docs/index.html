<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Facture</title>

<style>
body { font-family: Arial; margin: 20px; }
h2, h3 { margin: 5px 0; }
.section { margin-bottom: 15px; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
table, th, td { border: 1px solid black; }
th, td { padding: 8px; }
.total { text-align: right; font-weight: bold; font-size: 18px; }
hr { margin: 10px 0; }
</style>
</head>

<body>

<!-- ENTREPRISE -->
<div class="section">
    <h2 id="entreprise"></h2>
    <h3 id="agence"></h3>

    <p>Adresse : <span id="adresse_agence"></span></p>
    <p>Ville : <span id="ville_agence"></span></p>
    <p>Téléphone : <span id="tel_agence"></span></p>
</div>

<hr>

<!-- FACTURE -->
<div class="section">
    <p><b>FACTURE N° :</b> <span id="facture"></span></p>
    <p><b>Date :</b> <span id="date"></span></p>
</div>

<hr>

<!-- CLIENT -->
<div class="section">
    <h3>CLIENT</h3>
    <p>Nom : <span id="client"></span></p>
    <p>Téléphone : <span id="tel_client"></span></p>
    <p>Adresse : <span id="adresse_client"></span></p>
</div>

<hr>

<!-- PRODUITS -->
<div class="section">
    <h3>DÉTAILS DES PRODUITS</h3>

    <table>
        <thead>
            <tr>
                <th>Produit</th>
                <th>Quantité</th>
                <th>Prix</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody id="produits"></tbody>
    </table>
</div>

<hr>

<!-- RÉSUMÉ -->
<div class="section">
    <p>Total Facture : <span id="total"></span></p>
    <p>Montant Payé : <span id="paye"></span></p>
    <p>Reste à payer : <span id="reste"></span></p>
    <p>Statut : <span id="statut"></span></p>
</div>

<hr>

<!-- QR -->
<div class="section">
    <p><b>QR :</b> <span id="qr"></span></p>
</div>

<script>
function getParam(name) {
    const url = new URL(window.location.href);
    return url.searchParams.get(name) || "";
}

/* ENTREPRISE */
document.getElementById("entreprise").innerText = getParam("entreprise");
document.getElementById("agence").innerText = getParam("agence");
document.getElementById("adresse_agence").innerText = getParam("adresse_agence");
document.getElementById("ville_agence").innerText = getParam("ville_agence");
document.getElementById("tel_agence").innerText = getParam("tel_agence");

/* FACTURE */
document.getElementById("facture").innerText = getParam("id");
document.getElementById("date").innerText = getParam("date");

/* CLIENT */
document.getElementById("client").innerText = getParam("client");
document.getElementById("tel_client").innerText = getParam("tel_client");
document.getElementById("adresse_client").innerText = getParam("adresse_client");

/* TOTAL */
document.getElementById("total").innerText = getParam("total");
document.getElementById("paye").innerText = getParam("paye");
document.getElementById("reste").innerText = getParam("reste");
document.getElementById("statut").innerText = getParam("statut");

/* QR */
document.getElementById("qr").innerText = getParam("qr");

/* PRODUITS */
let produits = getParam("produits") || "";
let tbody = document.getElementById("produits");

if (produits !== "") {
    let lignes = produits.split(";");

    lignes.forEach(l => {
        let p = l.split("|");

        let nom = p[0] || "";
        let qte = Number(p[1] || 0);
        let prix = Number(p[2] || 0);
        let total = qte * prix;

        tbody.innerHTML += `
        <tr>
            <td>${nom}</td>
            <td>${qte}</td>
            <td>${prix}</td>
            <td>${total}</td>
        </tr>`;
    });
}
</script>

</body>
</html>
