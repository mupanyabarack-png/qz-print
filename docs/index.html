    <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Facture</title>

<style>

body{
  font-family: Arial;
  width: 58mm;
  margin: auto;
  font-size: 12px;
}

h2,h3{
  text-align:center;
  margin:3px;
}

hr{
  border: none;
  border-top: 1px dashed black;
  margin: 5px 0;
}

.produit{
  border-bottom:1px dashed black;
  padding:6px 0;
  line-height: 1.4;
}

.footer{
  text-align:center;
  margin-top:10px;
  font-weight:bold;
}

p{
  margin:2px 0;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
}

@media print {
  #printBtn{
    display:none !important;
  }
}

</style>
</head>

<body>

<!-- ENTREPRISE -->
<h2 id="entreprise"></h2>
<p style="text-align:center;" id="rccm"></p>
<h3 id="agence"></h3>

<hr>

<!-- FACTURE -->
<p><b>FACTURE :</b> <span id="facture"></span></p>
<p><b>DATE :</b> <span id="date"></span></p>
<p><b>CLIENT :</b> <span id="client"></span></p>
<p><b>STATUT :</b> <span id="statut"></span></p>

<hr>

<!-- PRODUITS -->
<div id="produits"></div>

<hr>

<!-- FINANCES PRO -->
<p><b>HT (Sous-total) :</b> <span id="ht"></span></p>
<p><b>Remise (%) :</b> <span id="remise"></span></p>
<p><b>TVA (%) :</b> <span id="tva"></span></p>

<p><b>TOTAL TTC :</b> <span id="ttc"></span></p>
<p><b>PAYÉ :</b> <span id="paye"></span></p>
<p><b>RESTE :</b> <span id="reste"></span></p>

<hr>

<!-- QR CODE -->
<div style="text-align:center;">
  <img id="qr" width="120">
</div>

<!-- FOOTER -->
<div class="footer">
Merci pour votre confiance - <span id="footerEnt"></span>
</div>

<button id="printBtn" onclick="window.print()">Imprimer</button>

<script>

const params = new URLSearchParams(window.location.search);

// ================= ENTREPRISE =================
document.getElementById("entreprise").innerText = params.get("entreprise") || "";
document.getElementById("rccm").innerText = "RCCM: " + (params.get("rccm") || "");
document.getElementById("agence").innerText = params.get("agence") || "";

// ================= FACTURE =================
document.getElementById("facture").innerText = params.get("facture") || "";
document.getElementById("date").innerText = params.get("date") || "";
document.getElementById("client").innerText = params.get("client") || "";
document.getElementById("statut").innerText = params.get("statut") || "";

// ================= FINANCES =================
document.getElementById("ht").innerText = params.get("ht") || "0";
document.getElementById("remise").innerText = params.get("remise") || "0";
document.getElementById("tva").innerText = params.get("tva") || "0";
document.getElementById("ttc").innerText = params.get("ttc") || "0";
document.getElementById("paye").innerText = params.get("paye") || "0";
document.getElementById("reste").innerText = params.get("reste") || "0";

document.getElementById("footerEnt").innerText =
params.get("entreprise") || "";

// ================= PRODUITS =================
const produits = decodeURIComponent(params.get("produits") || "");
const container = document.getElementById("produits");

if(produits.trim() !== ""){

  const lignes = produits.split("###").filter(x => x.trim() !== "");

  lignes.forEach(l => {

    const d = l.split("|||").map(x => (x || "").trim());

    if(d.length >= 4){

      const div = document.createElement("div");
      div.className = "produit";

      div.innerHTML =
        "<b>" + d[0] + "</b><br>" +
        "Qté: " + d[1] + "<br>" +
        "PU: " + d[2] + "<br>" +
        "Total: " + d[3];

      container.appendChild(div);
    }

  });

}

// ================= QR CODE =================
let qrText =
"FACTURE: " + (params.get("facture") || "") + "\n" +
"CLIENT: " + (params.get("client") || "") + "\n" +
"TOTAL TTC: " + (params.get("ttc") || "") + "\n" +
"STATUT: " + (params.get("statut") || "");

document.getElementById("qr").src =
"https://api.qrserver.com/v1/create-qr-code/?size=150x150&data="
+ encodeURIComponent(qrText);

</script>

</body>
</html>
