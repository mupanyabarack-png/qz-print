<!DOCTYPE html>
<html>
<body>

<h2 id="entreprise">ENTREPRISE</h2>
<p id="agence">AGENCE</p>

<hr>

<p>Facture : <span id="facture"></span></p>
<p>Date : <span id="date"></span></p>
<p>Client : <span id="client"></span></p>

<hr>

<h3>Produits</h3>
<table border="1" width="100%">
<thead>
<tr>
<th>Produit</th>
<th>Qté</th>
<th>Prix</th>
<th>Total</th>
</tr>
</thead>
<tbody id="produits"></tbody>
</table>

<hr>

<p><b>Total Général :</b> <span id="total"></span></p>

<script>
function getParam(name) {
    const url = new URL(window.location.href);
    return url.searchParams.get(name) || "";
}

/* INFOS */
document.getElementById("entreprise").innerText = getParam("entreprise") || "ENTREPRISE";
document.getElementById("agence").innerText = getParam("agence") || "AGENCE";
document.getElementById("facture").innerText = getParam("id");
document.getElementById("date").innerText = getParam("date");
document.getElementById("client").innerText = getParam("client");
document.getElementById("total").innerText = getParam("total");

/* PRODUITS */
let produits = getParam("produits");
let tbody = document.getElementById("produits");

if (produits) {
    let lignes = produits.split(";");

    lignes.forEach(l => {
        let p = l.split("|");

        let nom = p[0] || "";
        let qte = Number(p[1] || 0);
        let prix = Number(p[2] || 0);
        let total = qte * prix;

        tbody.innerHTML += `
        <tr>
            <td>${nom}</td>
            <td>${qte}</td>
            <td>${prix}</td>
            <td>${total}</td>
        </tr>`;
    });
}

/* PRINT AUTO */
window.onload = function () {
    setTimeout(() => window.print(), 1000);
};
</script>

</body>
</html>
