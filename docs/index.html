<script>
function getParam(name) {
    const url = new URL(window.location.href);
    return url.searchParams.get(name) || "";
}

/* ENTREPRISE */
document.getElementById("entreprise").innerText = getParam("entreprise");
document.getElementById("agence").innerText = getParam("agence");
document.getElementById("adresse_agence").innerText = getParam("adresse_agence");
document.getElementById("ville_agence").innerText = getParam("ville_agence");
document.getElementById("tel_agence").innerText = getParam("tel_agence");

/* FACTURE */
document.getElementById("facture_num").innerText = getParam("id");
document.getElementById("date").innerText = getParam("date");

/* CLIENT */
document.getElementById("client").innerText = getParam("client");
document.getElementById("tel_client").innerText = getParam("tel_client");
document.getElementById("adresse_client").innerText = getParam("adresse_client");

/* RESUME */
document.getElementById("total").innerText = getParam("total");
document.getElementById("paye").innerText = getParam("paye");
document.getElementById("reste").innerText = getParam("reste");
document.getElementById("statut").innerText = getParam("statut");

/* QR */
document.getElementById("qr").innerText = getParam("qr");
document.getElementById("entreprise2").innerText = getParam("entreprise");

/* PRODUITS */
let produits = getParam("produits") || "";
let tbody = document.getElementById("produits");

if (produits !== "") {
    let lignes = produits.split(";");

    lignes.forEach(l => {
        let p = l.split("|");

        let nom = p[0] || "";
        let qte = Number(p[1] || 0);
        let prix = Number(p[2] || 0);
        let total = qte * prix;

        tbody.innerHTML += `
        <tr>
            <td>${nom}</td>
            <td>${qte}</td>
            <td>${prix}</td>
            <td>${total}</td>
        </tr>`;
    });
}
</script>
