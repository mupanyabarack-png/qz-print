<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Facture</title>

<style>

/* =======================
FORMAT TICKET 58mm
======================= */

body{
  font-family: Arial;
  width: 58mm;
  margin: auto;
  font-size: 12px;
}

h2,h3{
  text-align:center;
  margin:3px;
}

.produit{
  border-bottom:1px dashed black;
  padding:4px 0;
}

.footer{
  text-align:center;
  margin-top:10px;
  font-weight:bold;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
}

/* cacher bouton impression */
@media print {
  #printBtn{
    display:none !important;
  }
}

/* éviter coupure QR */
@media print {
  img{
    page-break-inside: avoid;
  }
}

</style>
</head>

<body>

<!-- ENTREPRISE -->
<h2 id="entreprise"></h2>
<p id="rccm" style="text-align:center;"></p>

<h3 id="agence"></h3>

<hr>

<!-- FACTURE -->
<p><b>FACTURE :</b> <span id="facture"></span></p>
<p><b>DATE :</b> <span id="date"></span></p>
<p><b>CLIENT :</b> <span id="client"></span></p>
<p><b>STATUT :</b> <span id="statut"></span></p>

<hr>

<!-- PRODUITS -->
<div id="produits"></div>

<hr>

<!-- FINANCES -->
<p><b>Sous-total :</b> <span id="sous_total"></span></p>
<p><b>Remise :</b> <span id="remise"></span></p>
<p><b>TVA :</b> <span id="tva"></span></p>

<p><b>TOTAL :</b> <span id="total"></span></p>
<p><b>PAYÉ :</b> <span id="paye"></span></p>
<p><b>RESTE :</b> <span id="reste"></span></p>

<hr>

<!-- QR CODE -->
<div style="text-align:center; margin-top:10px;">
  <img id="qrImage" width="120" alt="QR Code">
</div>

<!-- FOOTER -->
<div class="footer">
<p id="footerEntreprise"></p>
</div>

<!-- PRINT -->
<button id="printBtn" onclick="window.print()">
Imprimer
</button>

<script>

// =======================
// URL PARAMS
// =======================
const params = new URLSearchParams(window.location.search);

// =======================
// ENTREPRISE
// =======================
document.getElementById("entreprise").innerText =
params.get("entreprise") || "";

document.getElementById("rccm").innerText =
"RCCM: " + (params.get("rccm") || "");

document.getElementById("agence").innerText =
params.get("agence") || "";

document.getElementById("facture").innerText =
params.get("facture") || "";

document.getElementById("date").innerText =
params.get("date") || "";

document.getElementById("client").innerText =
params.get("client") || "";

document.getElementById("statut").innerText =
params.get("statut") || "";

// =======================
// FINANCES
// =======================
document.getElementById("sous_total").innerText =
params.get("sous_total") || "0";

document.getElementById("remise").innerText =
params.get("remise") || "0";

document.getElementById("tva").innerText =
params.get("tva") || "0";

document.getElementById("total").innerText =
params.get("montant_total") || "0";

document.getElementById("paye").innerText =
params.get("montant_paye") || "0";

document.getElementById("reste").innerText =
params.get("reste") || "0";

// Footer
document.getElementById("footerEntreprise").innerText =
"Merci pour votre confiance - " +
(params.get("entreprise") || "");

// =======================
// PRODUITS (ROBUSTE)
// =======================
let produits = decodeURIComponent(params.get("produits") || "");

const container = document.getElementById("produits");

if(produits.trim() !== ""){

  const lignes = produits.split("###").filter(x => x.trim() !== "");

  lignes.forEach(ligne => {

    const data = ligne.split("|||").map(e => (e || "").trim());

    if(data.length >= 4){

      const nom = data[0];
      const qte = data[1];
      const pu = data[2];
      const totalL = data[3];

      const div = document.createElement("div");
      div.className = "produit";

      div.innerHTML =
        "<b>" + nom + "</b><br>" +
        "Qté: " + qte + "<br>" +
        "PU: " + pu + "<br>" +
        "Total: " + totalL;

      container.appendChild(div);

    }

  });

}

// =======================
// QR CODE
// =======================

let qrText =
"FACTURE: " + (params.get("facture") || "") + "\n" +
"CLIENT: " + (params.get("client") || "") + "\n" +
"TOTAL: " + (params.get("montant_total") || "0") + "\n" +
"STATUT: " + (params.get("statut") || "");

const qrImg = document.getElementById("qrImage");

setTimeout(() => {
  qrImg.src =
  "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data="
  + encodeURIComponent(qrText);
}, 300);

</script>

</body>
</html>
