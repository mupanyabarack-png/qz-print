<script>
function getParam(name) {
    const url = new URL(window.location.href);
    return url.searchParams.get(name) || "";
}

// ENTREPRISE
document.getElementById("entreprise").innerText = getParam("entreprise");
document.getElementById("agence").innerText = getParam("agence");

// FACTURE
document.getElementById("facture").innerText = getParam("id");
document.getElementById("client").innerText = getParam("client");
document.getElementById("total").innerText = getParam("total");

// PRODUITS
let produitsRaw = getParam("produits");

let tbody = document.getElementById("produits");
tbody.innerHTML = "";

if (produitsRaw) {
    let lignes = produitsRaw.split(";");

    lignes.forEach(l => {
        let p = l.split("|");

        let nom = p[0] || "";
        let qte = parseFloat(p[1] || 0);
        let prix = parseFloat(p[2] || 0);
        let total = qte * prix;

        tbody.innerHTML += `
        <tr>
            <td>${nom}</td>
            <td>${qte}</td>
            <td>${prix}</td>
            <td>${total}</td>
        </tr>`;
    });
}
</script>
