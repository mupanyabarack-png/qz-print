 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Facture</title>

<!-- QR CODE -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

/* =======================
FORMAT TICKET
======================= */

body{
  font-family: Arial;
  width: 58mm;
  margin: auto;
  font-size: 12px;
}

/*
Pour 80mm remplace simplement :
width:58mm;
par
width:80mm;
*/

h2,h3{
  text-align:center;
  margin:3px;
}

.info{
  margin-bottom:5px;
}

.produit{
  border-bottom:1px dashed black;
  padding:5px 0;
}

.footer{
  text-align:center;
  margin-top:10px;
  font-weight:bold;
}

#qrcode{
  display:flex;
  justify-content:center;
  margin-top:10px;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
}

/* Cache bouton impression */
@media print {

  #printBtn{
    display:none !important;
  }

}

</style>
</head>

<body>

<h2 id="entreprise"></h2>
<h3 id="agence"></h3>

<div class="info">
<p><b>FACTURE :</b> <span id="facture"></span></p>
<p><b>DATE :</b> <span id="date"></span></p>
<p><b>CLIENT :</b> <span id="client"></span></p>
</div>

<!-- PRODUITS -->
<div id="produits"></div>

<br>

<p><b>TOTAL :</b> <span id="total"></span></p>
<p><b>PAYÉ :</b> <span id="paye"></span></p>
<p><b>RESTE :</b> <span id="reste"></span></p>
<p><b>STATUT :</b> <span id="statut"></span></p>

<!-- QR CODE -->
<div id="qrcode"></div>

<div class="footer">
<p id="footerEntreprise"></p>
</div>

<button id="printBtn" onclick="window.print()">
Imprimer
</button>

<script>

// =======================
// PARAMÈTRES URL
// =======================

const params = new URLSearchParams(window.location.search);

// =======================
// INFOS FACTURE
// =======================

const entreprise = params.get("entreprise") || "";
const agence = params.get("agence") || "";
const facture = params.get("facture") || "";
const date = params.get("date") || "";
const client = params.get("client") || "";
const montant_total = params.get("montant_total") || "0";
const montant_paye = params.get("montant_paye") || "0";
const reste = params.get("reste") || "0";
const statut = params.get("statut") || "";

// =======================
// AFFICHAGE
// =======================

document.getElementById("entreprise").innerText = entreprise;
document.getElementById("agence").innerText = agence;
document.getElementById("facture").innerText = facture;
document.getElementById("date").innerText = date;
document.getElementById("client").innerText = client;

document.getElementById("total").innerText = montant_total;
document.getElementById("paye").innerText = montant_paye;
document.getElementById("reste").innerText = reste;
document.getElementById("statut").innerText = statut;

// =======================
// FOOTER
// =======================

document.getElementById("footerEntreprise").innerText =
"Merci pour votre confiance - " + entreprise;

// =======================
// PRODUITS
// =======================

let produits = params.get("produits") || "";

produits = decodeURIComponent(produits);

const container = document.getElementById("produits");

let produitsQR = "";

if(produits.trim() !== ""){

  const lignes = produits.split("###");

  lignes.forEach(ligne => {

    const data = ligne.split("|||");

    if(data.length >= 4){

      const nomProduit = data[0];
      const quantite = data[1];
      const prix = data[2];
      const totalProduit = data[3];

      const div = document.createElement("div");

      div.className = "produit";

      div.innerHTML = `
        <b>${nomProduit}</b><br>
        Qté: ${quantite}<br>
        PU: ${prix}<br>
        Total: ${totalProduit}
      `;

      container.appendChild(div);

      // texte QR
      produitsQR +=
      "Produit: " + nomProduit +
      " | Qté: " + quantite +
      " | PU: " + prix +
      " | Total: " + totalProduit + "\n";

    }

  });

}

// =======================
// TEXTE QR CODE
// =======================

const qrText =
"Client: " + client + "\n" +
produitsQR +
"Montant Total: " + montant_total + "\n" +
"Statut: " + statut;

// =======================
// GÉNÉRATION QR CODE
// =======================

new QRCode(document.getElementById("qrcode"), {
    text: qrText,
    width: 120,
    height: 120
});

</script>

</body>
</html>
